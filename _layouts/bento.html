<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

<!-- OGP -->
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@father_cafe">

<link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body>

<header class="bento-header" id="site-header"></header>

<main class="bento-wrap">
{{ content }}
</main>

<footer class="bento-footer" id="site-footer"></footer>

<script src="{{ '/assets/js/config.js' | relative_url }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  try { SiteUI.init("{{ page.nav | default: 'home' }}"); } catch (e) { console.error(e); }
});
</script>

</body>
</html>
