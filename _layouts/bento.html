<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

<!-- OGP -->
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@father_cafe">

<link rel="stylesheet" href="{{ '/assets/css/bento.css' | relative_url }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="{{ '/assets/js/fire-store.js' | relative_url }}"></script>
</head>
<body>

<header class="bento-header">
  <div class="bento-header-inner">
    <a class="bento-logo" href="/fire-design/">father cafe<span class="logo-dot">.</span></a>
    <nav class="bento-nav">
      <a href="/fire-design/" {% if page.nav == 'home' %}class="active"{% endif %}>ホーム</a>
      <a href="/fire-design/design/" {% if page.nav == 'design' %}class="active"{% endif %}>FIRE設計図</a>
      <a href="/fire-design/simulator/" {% if page.nav == 'simulator' %}class="active"{% endif %}>シミュレーター</a>
      <a href="/fire-design/monthly-report/2026/06/15/monthly-report-002/" {% if page.nav == 'report' %}class="active"{% endif %}>月次レポート</a>
      <a href="/fire-design/about/" {% if page.nav == 'about' %}class="active"{% endif %}>About</a>
    </nav>
  </div>
</header>

<main class="bento-wrap">
{{ content }}
</main>

<footer class="bento-footer">
  <p>father cafe — FIRE&times;父親の実録 ／ <a href="https://x.com/father_cafe">X @father_cafe</a> ／ <a href="{{ site.github.repository_url }}">GitHub</a></p>
  <p>本サイトの数値は個人の記録であり、投資助言ではありません。</p>
</footer>

</body>
</html>
