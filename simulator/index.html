---
  layout: default
  title: FIREシミュレーター
  ---
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <div style="max-width:700px;margin:0 auto;">

  <p>現在の資産・毎月の積立・想定利回りを入力すると、FIRE達成見通しと100歳までの資産推移グラフを表示します。</p>

  <hr>

  <div style="background:#1a1a2e;border:1px solid #444;border-radius:8px;padding:24px;">

    <div style="margin-bottom:14px;">
      <label style="display:block;margin-bottom:4px;color:#f0c040;font-size:14px;">現在の年齢</label>
      <input id="currentAge" type="number" value="43" min="1" max="99" style="width:100%;box-sizing:border-box;padding:8px;border-radius:4px;border:1px solid #666;background:#2a2a3e;color:#fff;font-size:15px;">
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block;margin-bottom:4px;color:#f0c040;font-size:14px;">現在の総資産（万円）</label>
      <input id="currentAssets" type="number" value="10009" style="width:100%;box-sizing:border-box;padding:8px;border-radius:4px;border:1px solid #666;background:#2a2a3e;color:#fff;font-size:15px;">
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block;margin-bottom:4px;color:#f0c040;font-size:14px;">毎月の積立額（万円）</label>
      <input id="monthlyContrib" type="number" value="0" style="width:100%;box-sizing:border-box;padding:8px;border-radius:4px;border:1px solid #666;background:#2a2a3e;color:#fff;font-size:15px;">
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block;margin-bottom:4px;color:#f0c040;font-size:14px;">年間想定利回り（%）</label>
      <input id="annualReturn" type="number" value="5" step="0.1" style="width:100%;box-sizing:border-box;padding:8px;border-radius:4px;border:1px solid #666;background:#2a2a3e;color:#fff;font-size:15px;">
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block;margin-bottom:4px;color:#f0c040;font-size:14px;">FIRE目標資産額（万円）</label>
      <input id="fireTarget" type="number" value="13500" style="width:100%;box-sizing:border-box;padding:8px;border-radius:4px;border:1px solid #666;background:#2a2a3e;color:#fff;font-size:15px;">
    </div>

    <div style="margin-bottom:18px;">
      <label style="display:block;margin-bottom:4px;color:#f0c040;font-size:14px;">FIRE後の年間取崩し額（万円）</label>
      <input id="annualWithdraw" type="number" value="300" style="width:100%;box-sizing:border-box;padding:8px;border-radius:4px;border:1px solid #666;background:#2a2a3e;color:#fff;font-size:15px;">
    </div>

    <button onclick="calcFire()" style="width:100%;padding:13px;background:#3b82f6;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;">計算する</button>

    <div id="result" style="margin-top:18px;"></div>

    <div id="chartContainer" style="margin-top:24px;display:none;">
      <canvas id="fireChart"></canvas>
    </div>

  </div>

  </div>

  <script>
  var fireChartInstance = null;

function calcFire() {
    var currentAge = parseInt(document.getElementById('currentAge').value) || 43;
  var current    = parseFloat(document.getElementById('currentAssets').value) || 0;
  var monthly    = parseFloat(document.getElementById('monthlyContrib').value) || 0;
  var rate       = parseFloat(document.getElementById('annualReturn').value) / 100 || 0.05;
  var target     = parseFloat(document.getElementById('fireTarget').value) || 13500;
  var annualWith = parseFloat(document.getElementById('annualWithdraw').value) || 300;

  var monthlyRate = rate / 12;
  var months = 0;
  var assets = current;

  while (assets < target && months < 600) {
    assets = assets * (1 + monthlyRate) + monthly;
    months++;
  }

  var resultDiv   = document.getElementById('result');
  var progressPct = Math.min((current / target * 100).toFixed(1), 100);

  if (months >= 600) {
    resultDiv.innerHTML = '<div style="background:#2a1a1a;border:1px solid #c44;border-radius:6px;padding:14px;">'
            + '<p style="color:#f66;font-size:17px;margin:0 0 6px;">⚠️ 50年以内には達成できない見込みです</p>'
            + '<p style="color:#999;margin:0;">積立額の増加か利回りの見直しを検討してください。</p>'
            + '</div>';
    document.getElementById('chartContainer').style.display = 'none';
    return;
  }

  var fireAge  = currentAge + Math.floor(months / 12);
  var fireYrs  = Math.floor(months / 12);
  var fireMons = months % 12;
  var finalAss = Math.round(assets);

  resultDiv.innerHTML =
        '<div style="background:#0d2010;border:1px solid #3b82f6;border-radius:6px;padding:14px;">'
        + '<p style="color:#4ade80;font-size:19px;font-weight:bold;margin:0 0 5px;">🎯 FIRE達成まで ' + fireYrs + '年' + fireMons + 'ヶ月（' + fireAge + '歳）</p>'
        + '<p style="color:#ccc;margin:0 0 3px;">達成時の資産額：約 ' + finalAss.toLocaleString() + ' 万円</p>'
        + '<p style="color:#ccc;margin:0;">現在の達成率：' + progressPct + '%</p>'
        + '</div>'
        + '<div style="background:#1a1a2e;height:6px;border-radius:3px;margin-top:10px;overflow:hidden;">'
        + '<div style="background:#3b82f6;height:6px;width:' + progressPct + '%;border-radius:3px;"></div>'
        + '</div>';

  // --- 100歳まで資産推移データ生成 ---
  var labels    = [];
  var dataAccum = [];
  var dataFire  = [];
  var maxAge    = 100;
  var totalMons = (maxAge - currentAge) * 12;
  var assetNow  = current;
  var reached   = false;

  for (var m = 0; m <= totalMons; m++) {
    if (m % 12 === 0) {
      var age = currentAge + m / 12;
      labels.push(Math.round(age) + '歳');
      if (!reached) {
        dataAccum.push(Math.round(assetNow));
        dataFire.push(null);
      } else {
        dataAccum.push(null);
        dataFire.push(Math.round(assetNow < 0 ? 0 : assetNow));
      }
    }
    if (!reached) {
      assetNow = assetNow * (1 + monthlyRate) + monthly;
      if (m + 1 >= months) reached = true;
    } else {
      assetNow = assetNow * (1 + monthlyRate) - annualWith / 12;
    }
  }

  // --- グラフ描画 ---
  document.getElementById('chartContainer').style.display = 'block';
  if (fireChartInstance) { fireChartInstance.destroy(); }

  var ctx = document.getElementById('fireChart').getContext('2d');
  fireChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
                  datasets: [
            {
                      label: '積立フェーズ',
                                  data: dataAccum,
                                  borderColor: '#3b82f6',
                                  backgroundColor: 'rgba(59,130,246,0.12)',
                                  borderWidth: 2,
                                  pointRadius: 0,
                                  spanGaps: false,
                                  fill: true,
                                  tension: 0.3
                        },
{
          label: 'FIRE後（取崩し）',
                      data: dataFire,
                      borderColor: '#4ade80',
                      backgroundColor: 'rgba(74,222,128,0.08)',
                      borderWidth: 2,
                      pointRadius: 0,
                      spanGaps: false,
                      fill: true,
                      tension: 0.3
            },
{
          label: 'FIRE目標',
                      data: Array(labels.length).fill(target),
                      borderColor: '#f0c040',
                      borderDash: [5, 4],
                      borderWidth: 1,
                      pointRadius: 0,
                      fill: false
            }
      ]
  },
    options: {
      responsive: true,
              plugins: {
        legend: { labels: { color: '#ccc', font: { size: 12 } } },
        tooltip: {
          callbacks: {
            label: function(c) {
              return c.raw === null ? null : c.dataset.label + ': ' + c.raw.toLocaleString() + ' 万円';
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#aaa', maxTicksLimit: 20, font: { size: 11 } },
          grid:  { color: 'rgba(255,255,255,0.05)' }
        },
        y: {
          ticks: {
            color: '#aaa', font: { size: 11 },
                          callback: function(v) { return v.toLocaleString() + '万'; }
          },
          grid: { color: 'rgba(255,255,255,0.05)' }
        }
      }
    }
});
}

calcFire();
</script>

  <hr>
  <h2>計算の前提</h2>
  <ul>
    <li>複利計算（月次）で試算しています</li>
    <li>税金・手数料は考慮していません</li>
    <li>FIRE後は積立停止、年間取崩し額を毎月均等に引き出す想定</li>
  </ul>

    <tr><th>FIRE目標</th><td>1億3,500万円</td></tr>
    <tr><th>達成率</th><td>69.4%</td></tr>
    <tr><th>想定利回り</th><td>5%（インデックス長期平均）</td></tr>
